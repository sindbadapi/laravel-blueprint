xdebug.mode=debug,develop
xdebug.start_with_request=trigger
; Xdebug runs inside the container and dials OUT to the IDE.
; Zed runs on the host and listens on port 9003, so the container must reach
; the host. On Docker Desktop (macOS/Windows) and via the extra_hosts mapping
; in compose.yaml (Linux), host.docker.internal resolves to the host gateway.
; Override with XDEBUG_CONFIG="client_host=..." if your topology differs.
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.discover_client_host=0
xdebug.idekey=ZED
xdebug.log=/tmp/xdebug.log
xdebug.log_level=7
